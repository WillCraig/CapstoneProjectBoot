apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Replace this placeholder namespace and host with the instructor assignment.
namespace: northstar-crm-prod-like
resources:
  - ../../base
replicas:
  - name: crm-backend
    count: 2
  - name: crm-frontend
    count: 2
patches:
  - target:
      kind: Ingress
      name: crm
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: crm-prod-like.example.invalid
