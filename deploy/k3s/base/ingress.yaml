apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm
  labels:
    app.kubernetes.io/name: crm-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: crm.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crm-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-frontend
                port:
                  name: http
