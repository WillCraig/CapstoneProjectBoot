<header>
  <a class="brand" routerLink="/home">Northstar CRM</a>
  @if (session.accessToken()) {
    <nav aria-label="Main navigation">
      <a routerLink="/customers">Customers</a>
      <a routerLink="/customers/new">New customer</a>
      <a routerLink="/interactions">Interactions</a>
      <a routerLink="/interactions/new">New interaction</a>
      <span data-testid="signed-in-user">{{ session.username() }} ({{ session.roles().join(', ') }})</span>
      <button type="button" data-testid="logout" (click)="logout()">Log out</button>
    </nav>
  }
</header>
<main>
  <router-outlet />
</main>
