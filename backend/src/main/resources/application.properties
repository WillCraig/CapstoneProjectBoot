spring.application.name=customer-management-platform

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/northstar_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=northstar-crm
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.northstar.crm.interaction



# Kafka
spring.kafka.consumer.properties[spring.json.value.default.type]=com.northstar.crm.interaction.CustomerInteractionRecordedV1
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.northstar.crm.interaction
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.listener.ack-mode=record
