spring:
  application:
    name: crm
  mvc:
    # Framework MVC errors (missing param, unreadable body, ...) also render as Problem Details.
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: crm-interactions-audit
      # earliest so a restarted consumer replays what it missed; dedupe makes replay safe.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.northstar.crm.messaging
crm:
  kafka:
    topic: crm.customer.interactions.v1
    # Poison records land on <topic>.DLT (DeadLetterPublishingRecoverer default naming).
    consumer-group: crm-interactions-audit
management:
  endpoints:
    web:
      # Only what the probes and an operator need; everything else stays unexposed.
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for the k3s probes.
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          # Not ready to take traffic until PostgreSQL answers; liveness ignores the DB so a
          # database outage does not make Kubernetes restart-loop healthy pods.
          include: readinessState,db
logging:
  pattern:
    # Every log line carries the request's correlation id (set by CorrelationIdFilter in MDC).
    level: "%5p [correlationId=%X{correlationId:-}]"
